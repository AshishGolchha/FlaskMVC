{%extends "layout/base.html" %}

{%block content %}
      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Status</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{loop.index}}</td>
                <td>{{user.name}}</td>
                <td>{{user.email}}</td>
                <td>{{user.status}}</td>
                <td>
                  <a class="btn btn-sm btn-primary" href="/users/{{user.id}}/edit">Edit</a>
                   <a class="btn btn-sm btn-primary" href="/users/{{user.id}}">View</a>
                  <form action="{{url_for('users.delete',id=user.id)}}" method="post">
                  <button  type="submit" onclick="confirm_delete()" class="btn btn-sm btn-danger">Delete</button>

                  </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
      </table>
  {%endblock%}
